# Minimal forward proxy for clipCowboy_bot's web_fetch tool.
# Lets OpenClaw call http://192.168.1.38:8765 (and any other LAN host) without
# tripping its built-in SSRF guard, which blocks RFC 1918 by resolved IP.
# Set tools.web.fetch.useTrustedEnvProxy: true on the bot side so OpenClaw
# routes through this proxy and skips local DNS pinning.

User tinyproxy
Group tinyproxy
Port 8888
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"

# Listen on all interfaces inside the container; docker network controls reach.
# (No Listen directive = listen on every interface.)
MaxClients 50

# Allow the entire docker bridge networks. Tighten if more services share this
# network. The bot is the only intended client today.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Permit CONNECT to the pipeline control port and standard https ports.
# Without this list, CONNECT (used for HTTPS tunneling) is denied by default.
ConnectPort 443
ConnectPort 563
ConnectPort 8765

# No upstream — straight forward proxy.
# Logs to stdout so `docker logs tinyproxy` shows traffic.
LogLevel Info
LogFile ""
